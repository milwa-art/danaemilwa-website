
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Danae Milwa – Emotionen in künstlerischen Welten.">

  <title>Danae Milwa | Künstlerin</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Schriftart Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
      font-family: 'Quicksand', sans-serif;
    }

    /* Bildbereich */
    .hero {
      position: relative;
      width: 100%;
      height: clamp(280px, 55vw, 650px);
      overflow: hidden;
      background: #A1C4C9;
    }

    .artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
    }

/* Logo-Fläche */
.logo-panel {
  position: absolute;
  left: 3.5%;
  top: 29.5%;
  width: 51%;
  padding: 1.5% 2%;
  background: rgba(0, 0, 0, 0.38);
}

/* Transparentes Logo */
.logo {
  display: block;
  width: 100%;
  height: auto;
}

/* Anpassung für Smartphones */
@media (max-width: 600px) {
  .logo-panel {
    left: 3.5%;
    top: 29.5%;
    width: 52%;
    padding: 2% 2.5%;
  }
}

    /* Weißer Bereich mit den Buttons */
    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 42px 24px 55px;
      background: #FFFFFF;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 390px;
      min-height: 58px;
      padding: 16px 24px;

      background: #A1C4C9;
      color: #FFFFFF;

      font-family: 'Quicksand', sans-serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-decoration: none;

      transition: background 0.2s ease, transform 0.2s ease;
    }

    .button:hover {
      background: #83ADB3;
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid #526F74;
      outline-offset: 4px;
    }
    
/* Footer mit rechtlichen Links */
.footer {
  background: rgb(39, 37, 37);
  color: #FFFFFF;
  padding: 28px 20px;
  text-align: center;
}

.footer-links {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;

  font-family: 'Quicksand', sans-serif;
  font-size: 16px;
  font-weight: 500;
}

.footer-links a {
  color: #FFFFFF;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 0.2s ease;
}

.footer-links a:hover {
  color: #A1C4C9;
}

.footer-separator {
  color: rgba(255, 255, 255, 0.65);
}

/* Anpassung für Smartphones */
@media (max-width: 600px) {
  .footer {
    padding: 24px 18px;
  }

  .footer-links {
    gap: 10px;
    font-size: 14px;
  }
}

    /* Anpassung für Smartphones */
     @media (max-width: 600px) {
      .hero {
        height: clamp(250px, 72vw, 430px);
      }

      .links {
        gap: 15px;
        padding: 32px 22px 42px;
      }

      .button {
        max-width: 100%;
        min-height: 45px;
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main>

    <section class="hero">
      <img
        class="artwork"
        src="kunstwerk.jpg"
        alt="Kunstwerk von Danae Milwa"
      >

 <div class="logo-panel">
        <img
          class="logo"
          src="logo.png"
          alt="Danae Milwa – Emotionen in künstlerischen Welten"
        >
      </div>
    </section>

    <nav class="links" aria-label="Weitere Seiten">

      <a
        class="button"
        href="https://danae-milwa.jimdofree.com/"
      >
        Website
          </a>

  <a
    class="button"
    href="https://danae-milwa.jimdofree.com/mailingliste/"
  >
    Mailingliste
      </a>

      <a
        class="button"
        href="https://www.instagram.com/danae_milwa/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

 
  </nav>

</main>

<footer class="footer">
  <nav class="footer-links" aria-label="Rechtliche Informationen">

    <a href="https://danae-milwa.jimdofree.com/about/">
      Impressum
    </a>

    <span class="footer-separator" aria-hidden="true">|</span>

    <a href="https://danae-milwa.jimdofree.com/j/privacy">
      Datenschutz
    </a>

    <span class="footer-separator" aria-hidden="true">|</span>

    <a href="https://danae-milwa.jimdofree.com/j/legal-guarantee">
      Gesetzliche Gewährleistung
    </a>

  </nav>
</footer>

</body>
</html>
